services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bot_container
    environment:
      - TOKEN=${TOKEN}
      - GUILDS=${GUILDS}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_FORMAT=${LOG_FORMAT}
      - LOG_SOURCE=${LOG_SOURCE}
    volumes:
      - ./data:/data
    restart: unless-stopped
